<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>Omnipresent God of War — Translation Reader</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<!-- icon sprite (inline, so the app also works offline / from file://) -->
<svg class="sprite" aria-hidden="true" focusable="false"><defs>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 9a6 6 0 1 1 12 0c0 5 2 6 2 6H4s2-1 2-6"/><path d="M10 20a2 2 0 0 0 4 0"/></symbol>
  <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><path d="M14 4v4M8 10v4M16 16v4"/></symbol>
  <symbol id="i-dots" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.3-4.3"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-filter" viewBox="0 0 24 24"><path d="M4 7h16M7 12h10M10 17h4"/></symbol>
  <symbol id="i-sort" viewBox="0 0 24 24"><path d="M7 4v16M7 20l-3-3M7 20l3-3"/><path d="M17 20V4M17 4l-3 3M17 4l3 3"/></symbol>
  <symbol id="i-fire" viewBox="0 0 24 24"><path d="M12 3s5 4 5 9a5 5 0 0 1-10 0c0-2 1-3 1-3s0 2 2 2 1-4 2-8z"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 4l2.4 5 5.6.8-4 4 .9 5.6L12 16.8 7.1 19.4 8 13.8l-4-4 5.6-.8z"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v18H6a2 2 0 0 1-2-2z"/><path d="M8 3v18"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4.5l3 1.5"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></symbol>
  <symbol id="i-chev-l" viewBox="0 0 24 24"><path d="M14.5 5.5L8 12l6.5 6.5"/></symbol>
  <symbol id="i-chev-r" viewBox="0 0 24 24"><path d="M9.5 5.5L16 12l-6.5 6.5"/></symbol>
  <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></symbol>
  <symbol id="i-db" viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v12c0 1.7 3.1 3 7 3s7-1.3 7-3V6"/><path d="M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3"/></symbol>
</defs></svg>

<div class="app" id="app">
  <!-- ============================ LIBRARY VIEW ============================ -->
  <section class="view view--library" id="viewLibrary">
    <header class="appbar">
      <button class="icon-btn" id="libBack" type="button" aria-label="Back"><svg class="ic"><use href="#i-back"/></svg></button>
      <span class="appbar__title"></span>
    </header>

    <div class="scroll" id="libraryScroll">
      <article class="book-card">
        <img class="book-cover" src="assets/cover.png" alt="Cover of Omnipresent God of War" width="56" height="72" />
        <div class="book-card__body">
          <h2 class="book-card__title" id="bookTitle">Omnipresent God of War</h2>
          <p class="book-card__sub" id="bookSub">English translation project</p>
          <div class="book-card__stats" id="bookStats"></div>
        </div>
        <button class="pill pill--active" id="bookPill" type="button"><svg class="ic ic--sm"><use href="#i-book"/></svg> Reading</button>
      </article>

      <div class="project-row">
        <h1 class="project-title" id="projectTitle"></h1>
      
      </div>

      <nav class="tabs" id="tabs" role="tablist">
        <button class="tab is-active" role="tab" data-tab="translation" type="button">Translation</button>
        <button class="tab" role="tab" data-tab="batch" type="button">Batch</button>
        <button class="tab" role="tab" data-tab="glossary" type="button">Glossary</button>
        <button class="tab" role="tab" data-tab="rules" type="button">Rules</button>
        <button class="tab" role="tab" data-tab="info" type="button">Info</button>
      </nav>
      <!-- ---------------- tab panels ---------------- -->
      <div class="panel" data-panel="translation">
        <div class="search-row">
          <label class="search">
            <svg class="ic"><use href="#i-search"/></svg>
            <input id="searchInput" type="search" placeholder="Search chapters by number..." autocomplete="off" />
          </label>
          <button class="icon-btn icon-btn--box" id="addBtn" type="button" aria-label="Start a new translation"><svg class="ic"><use href="#i-plus"/></svg></button>
        </div>

        <div class="list-controls">
          <div class="list-controls__left">
            <button class="chip" id="filterBtn" type="button" aria-expanded="false"><svg class="ic ic--sm"><use href="#i-filter"/></svg> <span id="filterLabel">Filters</span></button>
            <div class="popover" id="filterPopover" hidden>
              <button class="popover__item" data-filter="all" type="button">All chapters</button>
              <button class="popover__item" data-filter="translated" type="button">Translated only</button>
              <button class="popover__item" data-filter="pending" type="button">Pending translation</button>
            </div>
          </div>
          <button class="chip" id="sortBtn" type="button"><svg class="ic ic--sm"><use href="#i-sort"/></svg> <span id="sortLabel">Ascending</span></button>
        </div>

        <button class="continue" id="continueBtn" type="button" hidden>
          <span class="continue__label">CONTINUE READING</span>
          <span class="continue__row"><span id="continueTitle">—</span><svg class="ic"><use href="#i-chev-r"/></svg></span>
        </button>

        <div class="list-head"><span id="listSummary">Loading…</span></div>
        <div class="chapter-list" id="chapterList"></div>

        <!-- the list shows one 50-chapter range at a time; this pill pager keeps
             three numbered ranges on screen (‹ 1 2 3 ›) and slides by one. It is
             the last block of the list itself and stays in the list flow
             (position: relative), so it scrolls with the chapters instead of
             hanging over them — no bar container around the caption -->
        <nav class="chapter-tabs" id="chapterTabs" aria-label="Chapter ranges">
          <p class="chapter-tabs__caption" id="rangeCaption">Chapters 1–50</p>
          <div class="chapter-tabs__row">
            <button class="chapter-tabs__arrow" id="rangePrev" type="button" aria-label="Previous chapters"><svg class="ic ic--sm"><use href="#i-chev-l"/></svg></button>
            <div class="chapter-tabs__list" id="rangeList"></div>
            <button class="chapter-tabs__arrow" id="rangeNext" type="button" aria-label="Next chapters"><svg class="ic ic--sm"><use href="#i-chev-r"/></svg></button>
          </div>
        </nav>
      </div>

      <div class="panel" data-panel="batch" hidden></div>
      <div class="panel" data-panel="glossary" hidden></div>
      <div class="panel" data-panel="rules" hidden></div>
      <div class="panel" data-panel="info" hidden></div>
    </div>
  </section>

  <!-- ============================ READER VIEW ============================ -->
  <section class="view view--reader" id="viewReader" hidden>
    <header class="appbar appbar--reader">
      <button class="icon-btn" id="readerBack" type="button" aria-label="Back to library"><svg class="ic"><use href="#i-back"/></svg></button>
      <div class="reader-head">
        <h2 class="reader-head__title" id="readerHeading">—</h2>
        <p class="reader-head__meta" id="readerMeta">—</p>
      </div>
      <button class="chip chip--mode" id="readerMode" type="button" aria-pressed="true" aria-label="Switch between whole-chapter and single-page reading"><svg class="ic ic--sm"><use href="#i-book"/></svg> <span id="readerModeLabel">Page view</span></button>
      <button class="icon-btn" id="readerMenu" type="button" aria-label="Page menu"><svg class="ic"><use href="#i-dots"/></svg></button>
    </header>
    <div class="reader-progress"><span id="readerProgressBar"></span></div>

    <div class="reader-scroll" id="readerScroll">
      <div class="status-note" id="readerNotice" hidden></div>
      <article class="reader-body" id="readerBody"></article>
      <details class="source-box" id="sourceBox" hidden>
        <summary>Original text (Chinese)</summary>
        <div class="source-box__body" id="sourceBody"></div>
      </details>
      <div class="reader-foot" id="readerFoot"></div>
    </div>

    <footer class="reader-nav">
      <button class="page-arrow" id="prevBtn" type="button" aria-label="Previous page">
        <svg class="ic ic--lg"><use href="#i-chev-l"/></svg>
      </button>
      <div class="reader-status">
        <span id="readerCounter">—</span>
        <span id="readerChapter">—</span>
        <span class="reader-status__hint" id="readerHint">Arrow keys ← → or tap the arrows</span>
      </div>
      <button class="page-arrow" id="nextBtn" type="button" aria-label="Next page">
        <svg class="ic ic--lg"><use href="#i-chev-r"/></svg>
      </button>
    </footer>
  </section>

  <div class="toast" id="toast" hidden></div>
</div>
<script src="data/novel-data.js"></script>
<script src="js/db.js"></script>
<script src="js/app.js"></script>
</body>
</html>
